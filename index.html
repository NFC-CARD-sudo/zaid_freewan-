<!DOCTYPE html>
    <html lang="ar" dir="rtl">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">
    <meta name="description" content="بطاقة زيد فريوان الرقمية وروابط التواصل الاجتماعي">
    <title>zaid freewan | زيد فريوان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --black: #080808;
        --black-soft: #11100e;
        --panel: #151311;
        --gold: #d6ad5a;
        --gold-light: #f5d98a;
        --gold-deep: #9c722d;
        --cream: #fff8e7;
        --muted: #bdb29d;
        --line: rgba(214, 173, 90, .28);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { min-height: 100%; background: var(--black); }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 16px;
        overflow-x: hidden;
        color: var(--cream);
        font-family: "Cairo", system-ui, sans-serif;
        background:
          radial-gradient(ellipse 70% 55% at 7% 8%, rgba(156, 114, 45, .17), transparent 68%),
          radial-gradient(ellipse 65% 65% at 94% 92%, rgba(214, 173, 90, .12), transparent 72%),
          linear-gradient(145deg, #050505 0%, #0e0d0b 48%, #060606 100%);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: .32;
        background-image: linear-gradient(rgba(214, 173, 90, .055) 1px, transparent 1px), linear-gradient(90deg, rgba(214, 173, 90, .055) 1px, transparent 1px);
        background-size: 46px 46px;
        mask-image: linear-gradient(to bottom, black, transparent 82%);
      }

      .card-shell {
        position: relative;
        z-index: 1;
        width: min(100%, 454px);
        animation: rise .8s cubic-bezier(.16, 1, .3, 1) both;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: none; } }

      .card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(214, 173, 90, .52);
        border-radius: 30px;
        background: linear-gradient(145deg, rgba(28, 25, 20, .98), rgba(9, 9, 8, .99) 54%, rgba(20, 16, 10, .99));
        box-shadow: 0 0 0 1px rgba(255, 230, 160, .06), 0 28px 90px rgba(0, 0, 0, .78), 0 0 80px rgba(156, 114, 45, .13);
        isolation: isolate;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(125deg, rgba(255,255,255,.07), transparent 25%, transparent 70%, rgba(214,173,90,.09));
      }

      .hero {
        position: relative;
        height: 362px;
        overflow: hidden;
        background: transparent;
    }
      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(180deg, rgba(4,4,4,.08) 8%, rgba(5,5,5,.06) 34%, rgba(6,6,6,.97) 100%), linear-gradient(90deg, rgba(214,173,90,.08), transparent 45%, rgba(0,0,0,.18));
      }
      .hero::after {
        content: "";
        position: absolute;
        right: 22px;
        bottom: 18px;
        left: 22px;
        z-index: 2;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(245,217,138,.7), transparent);
      }
      .hero img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 25%;
        filter: saturate(.92) contrast(1.08) brightness(.88);
        transform: scale(1.02);
      }
      .hero-top {
        position: absolute;
        top: 18px;
        right: 20px;
        left: 20px;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        direction: ltr;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(245, 217, 138, .38);
        border-radius: 999px;
        color: var(--gold-light);
        background: rgba(10, 10, 9, .58);
        backdrop-filter: blur(12px);
        font: 800 10px/1 "DM Sans", sans-serif;
        letter-spacing: 1.8px;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold-light);
        box-shadow: 0 0 14px var(--gold-light);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: .45; transform: scale(.72); } }
      .hero-mark {
        width: 52px;
        height: 52px;
        border: 1px solid rgba(245,217,138,.38);
        border-radius: 50%;
        color: var(--gold-light);
        display: grid;
        place-items: center;
        font: 800 18px/1 "DM Sans", sans-serif;
        background: rgba(10,10,9,.42);
        box-shadow: inset 0 0 18px rgba(214,173,90,.1), 0 0 25px rgba(214,173,90,.1);
      }
      .identity {
        position: absolute;
        right: 25px;
        bottom: 34px;
        left: 25px;
        z-index: 3;
        text-align: right;
      }
      .identity h1 {
        color: #fffdf6;
        font: 800 clamp(32px, 8vw, 45px)/1.02 "DM Sans", "Cairo", sans-serif;
        letter-spacing: .8px;
        text-shadow: 0 4px 24px rgba(0,0,0,.75);
        direction: ltr;
        text-align: right;
        text-transform: lowercase;
      }
      .identity p {
        margin-top: 9px;
        color: var(--gold-light);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 1.4px;
      }
      .identity-line {
        width: 90px;
        height: 3px;
        margin: 15px 0 0 auto;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--gold-deep), var(--gold-light));
        box-shadow: 0 0 18px rgba(245,217,138,.45);
      }

      .socials {
        display: grid;
        gap: 11px;
        padding: 23px 20px 20px;
      }
      .social-btn {
        position: relative;
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 73px;
        padding: 11px 14px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        color: var(--cream);
        text-decoration: none;
        background: linear-gradient(110deg, rgba(255,255,255,.06), rgba(255,255,255,.018));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
        transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
        direction: rtl;
      }
      .social-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: linear-gradient(110deg, rgba(214,173,90,.18), transparent 56%);
        transition: opacity .25s ease;
      }
      .social-btn:hover {
        transform: translateY(-3px);
        border-color: rgba(245, 217, 138, .72);
        background: linear-gradient(110deg, rgba(214,173,90,.14), rgba(255,255,255,.035));
        box-shadow: 0 13px 30px rgba(0,0,0,.42), 0 0 22px rgba(214,173,90,.12);
      }
      .social-btn:hover::before { opacity: 1; }
      .social-btn:active { transform: scale(.985); }
      .icon {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        flex: 0 0 45px;
        width: 45px;
        height: 45px;
        overflow: hidden;
        border: 1px solid rgba(245,217,138,.38);
        border-radius: 14px;
        background: #090909;
      }
      .icon img {
        display: block;
        visibility: visible;
        width: 43px;
        height: 43px;
        object-fit: contain;
        border-radius: 12px;
        filter: drop-shadow(0 3px 7px rgba(0,0,0,.42));
      }
      .icon.whatsapp img { width: 43px; height: 43px; }
      .social-copy {
        position: relative;
        z-index: 1;
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        gap: 2px;
        text-align: right;
      }
      .platform {
        color: var(--gold-light);
        font: 800 10px/1.2 "DM Sans", "Cairo", sans-serif;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .username {
        overflow: hidden;
        color: #fffdf6;
        font-size: 15px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .username.latin { direction: ltr; text-align: right; font-family: "DM Sans", "Cairo", sans-serif; }
      .arrow {
        position: relative;
        z-index: 1;
        color: var(--gold);
        font: 700 21px/1 "DM Sans", sans-serif;
        transition: color .25s ease, transform .25s ease;
      }
      .social-btn:hover .arrow { color: var(--gold-light); transform: translateX(-3px); }

      .footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 15px 20px 19px;
        border-top: 1px solid rgba(214,173,90,.18);
        color: #9e927b;
        font: 700 9px/1 "DM Sans", "Cairo", sans-serif;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .footer span { color: var(--gold-light); font-size: 8px; }

      @media (max-width: 420px) {
        body { padding: 14px 10px; }
        .card { border-radius: 24px; }
        .hero { height: 330px; }
        .socials { padding-inline: 14px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
